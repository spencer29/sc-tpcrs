[project]
name = "incident-service"
version = "0.1.0"
description = "SC-TPCRS incident-service (Module 6) -- incident response integration: auto-opens incidents from monitoring alerts, drives lifecycle/SLA, drafts CBN/NDPC regulatory notifications."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.0",
    "alembic>=1.13.0",
    "aiokafka>=0.10.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio >=1.0 defaults fixtures/tests to function-scoped event loops,
# which deadlocks a StaticPool aiosqlite engine shared across the session. Pin
# both to session scope so the fixture-created loop is the one tests run on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
