# SC-TPCRS frontend -- production nginx config (envsubst template).
#
# The stock nginx image renders this template into
# /etc/nginx/conf.d/default.conf at container start, substituting ONLY
# ${API_UPSTREAM} (see NGINX_ENVSUBST_FILTER in Dockerfile), so nginx runtime
# variables like $uri / $host are preserved verbatim.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Vite emits content-hashed filenames under /assets -- safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the API to the gateway so the SPA is SAME-ORIGIN and needs
    # no CORS (auth is a Bearer header, not cookies). The gateway owns the
    # /api/{prefix} routing, so the URI is passed through UNCHANGED -- note the
    # deliberate absence of a trailing slash on proxy_pass.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history-mode fallback: any unmatched path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
